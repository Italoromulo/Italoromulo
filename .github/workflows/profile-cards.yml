name: Profile-Cards

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 03:00 UTC
  workflow_dispatch:       # permite rodar manualmente

jobs:
  # Cards de estatísticas (preto e vermelho) -> salvos em images/ na branch main
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Card de estatísticas
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/userstats.svg
          # ordem: fundo, borda, ícone, título, texto
          colors: "#000000 #e60000 #e60000 #e60000 #e60000"
          custom-title: Estatísticas do GitHub
          hide-keys: languages
          locale: pt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Card de linguagens
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/languages.svg
          colors: "#000000 #e60000 #e60000 #e60000 #e60000"
          custom-title: Tecnologias
          hide-keys: general, repositories, contributions
          locale: pt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gráfico de atividade (preto e vermelho) -> salvo na branch "output"
  activity-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Gerar gráfico de atividade
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=000000&color=e60000&line=e60000&point=ffffff&area=true&area_color=e60000&hide_border=true&title=Atividade%20Mensal
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
